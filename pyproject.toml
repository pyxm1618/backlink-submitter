[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "backlink-submitter"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["playwright>=1.50,<2", "google-api-python-client>=2,<3", "google-auth>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[project.scripts]
backlink-submitter = "backlink_submitter.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.mypy]
files = ["src"]
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.packages.find]
where = ["src"]
